<!DOCTYPE html>
<html>
<head>
    <title>Robot WebSocket Client</title>
</head>
<body>
    <h1>Robot WebSocket Client</h1>

    <!-- Command buttons -->
    <button onclick="sendCommand('STOP')">STOP</button>
    <button onclick="sendCommand('MOVE_FORWARD')">MOVE_FORWARD</button>

    <p id="status">Not connected</p>
    <p id="serverResponse"></p>

    <script>
        const statusDiv = document.getElementById("status");
        const serverResponseDiv = document.getElementById("serverResponse");

        // Connect to the Java WebSocket server
        const ws = new WebSocket("ws://localhost:8765");

        ws.onopen = () => {
            console.log("Connected to server");
            statusDiv.innerText = "Connected!";
        };

        ws.onmessage = (event) => {
            console.log("Received from server:", event.data);
            serverResponseDiv.innerText = "Server: " + event.data;
        };

        ws.onclose = () => {
            console.log("Disconnected from server");
            statusDiv.innerText = "Disconnected!";
        };

        ws.onerror = (err) => {
            console.error("WebSocket error:", err);
            statusDiv.innerText = "Error connecting!";
        };

        // Function to send a command to the server
        function sendCommand(command) {
            if (ws.readyState === WebSocket.OPEN) {
                console.log("Sending:", command);
                ws.send(command);
            } else {
                console.log("WebSocket not open");
            }
        }
    </script>
</body>
</html>
